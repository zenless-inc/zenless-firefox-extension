name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and reference check
        run: node scripts/check.js
      - name: Unit tests
        run: npm test
      - name: web-ext lint
        run: npx --yes web-ext lint --self-hosted --source-dir . --ignore-files "tests/**" "scripts/**" package.json README.md PRIVACY.md ".github/**"
